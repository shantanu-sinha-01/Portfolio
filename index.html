<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ede4; --ink:#0b0b0b; --line:#0b0b0b; --muted:#5d5b55;
  --grid:rgba(0,0,0,.07); --screen:#d9d6cb; --shadow:rgba(0,0,0,.28); --chip:rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  --bg:#0e1114; --ink:#ece9df; --line:#ece9df; --muted:#a6a398;
  --grid:rgba(255,255,255,.06); --screen:#262a2c; --shadow:rgba(0,0,0,.7); --chip:rgba(255,255,255,.06);
}
:root[data-classic="on"][data-theme="dark"]{
  --bg:#060a06; --ink:#8dff9d; --line:#8dff9d; --muted:#5fbf72; --grid:rgba(141,255,157,.07); --screen:#0d1a10; --chip:rgba(141,255,157,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;padding:16px 16px 120px;transition:background .2s,color .2s}
a{color:inherit}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.frame{max-width:780px;margin:0 auto;border:2px solid var(--line);background:var(--bg)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;height:66px;border-bottom:2px solid var(--line)}
.logo{display:block;line-height:0}
.logo svg{width:54px;height:42px}
nav{display:flex;align-items:center;gap:.65em;font-weight:500;letter-spacing:.14em;font-size:12.5px;text-transform:uppercase}
nav a{text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
nav a.on{border-color:var(--ink)}
nav .sl{opacity:.6}
nav button{background:none;border:0;cursor:pointer;padding:2px;display:flex;align-items:center}
@media(max-width:470px){nav{font-size:10.5px;letter-spacing:.05em;gap:.45em}.top{padding:0 14px}.logo svg{width:44px;height:34px}}

/* sections */
.sec{padding:28px 24px 32px;border-bottom:3px solid var(--line);position:relative}
.frame>.sec:last-child{border-bottom:0}
.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.lbl{font-weight:700;letter-spacing:.22em;font-size:13px;text-transform:uppercase}
.lbl.big{font-size:15px}
.sub{font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.hd{font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif;font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.005em;font-size:clamp(32px,8.6vw,54px);margin:14px 0 18px}
.hd.sm{font-size:clamp(24px,6.6vw,40px);margin:0 0 20px}
.hd.md{font-size:clamp(26px,6.5vw,38px);margin:8px 0 14px}
.center{text-align:center}
p{margin:0 0 18px;max-width:64ch}
.hint{font-size:12.5px;color:var(--muted);margin:14px 0 0}

/* hero */
.hero{border-bottom:3px solid var(--line)}
.hero .pad{padding:24px 24px 0}
.schem{position:relative;min-height:400px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.sch{width:100%;height:auto;display:block;overflow:visible}
.sch .s{fill:none;stroke:var(--ink);stroke-width:1.3}
.sch .thin{stroke-width:.7}
.sch .faint{stroke:var(--ink);stroke-opacity:.12}
.sch .t{font:500 9px 'IBM Plex Mono',monospace;fill:var(--ink);letter-spacing:.05em}
.schem .foot-row{position:absolute;left:24px;right:24px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;font-weight:500;letter-spacing:.2em;font-size:13px;text-transform:uppercase}
.schem .foot-row .r{text-align:right;font-weight:700;line-height:1.7}
.hero-cta{padding:26px 24px 30px}
.cta-box{border:2px solid var(--ink);border-radius:4px;padding:16px 14px 14px;background:var(--bg);box-shadow:0 22px 40px -14px var(--shadow)}
.cta-box .lbl{text-align:center;margin:2px 0 14px}

/* buttons */
.btn-o{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:20px 24px;font-weight:700;letter-spacing:.2em;font-size:14px;text-transform:uppercase;text-decoration:none;cursor:pointer;text-align:left}
.btn-o:hover{background:var(--ink);color:var(--bg)}
.btn-o.sm{width:auto;padding:11px 16px;font-size:12px;letter-spacing:.16em}
.btn-b{display:block;width:100%;text-align:center;background:var(--ink);color:var(--bg);padding:22px 16px;border-radius:6px;font-weight:700;letter-spacing:.22em;font-size:16px;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer}
.btn-b:hover{opacity:.88}
.mini{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:transparent;padding:6px 12px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.mini:hover{background:var(--ink);color:var(--bg)}

/* key/value list */
.kv{margin:0 0 26px;border-top:1px dashed var(--ink)}
.kv div{display:flex;gap:16px;padding:9px 0;border-bottom:1px dashed var(--ink);font-size:14px}
.kv dt{width:110px;flex:none;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;padding-top:1px}
.kv dd{margin:0;font-weight:700}

/* qualifications / skills */
.list{display:grid;gap:16px;margin-top:6px}
@media(min-width:700px){.list.two{grid-template-columns:1fr 1fr}}
.qual{border:2px solid var(--ink);border-left-width:8px;padding:16px 18px;background:var(--bg)}
.qual h3{margin:0 0 4px;font-size:16px;letter-spacing:.04em;text-transform:uppercase;line-height:1.35}
.qual .org{font-weight:500}
.qual .per{display:inline-block;margin:8px 0 0;border:1.5px solid var(--ink);border-radius:6px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.qual .det{margin:10px 0 0;color:var(--muted);font-size:14px}
.group{border:2px solid var(--ink);padding:16px 18px 18px;background:var(--bg)}
.group .lbl{margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);border-radius:6px;padding:3px 11px;font-size:13px;color:var(--muted);background:var(--chip);letter-spacing:.03em;text-transform:uppercase;line-height:1.6}

/* achievements */
.ach{display:grid;gap:10px;margin:6px 0 0;padding:0;list-style:none}
.ach li{display:flex;gap:12px;border:2px solid var(--ink);padding:12px 16px;background:var(--bg);font-size:14.5px}
.ach li::before{content:'■';flex:none;font-size:9px;line-height:2.6}
@media(min-width:700px){.list.two .group:last-child:nth-child(odd){grid-column:1/-1}}

/* link box */
.links{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.lk{display:flex;align-items:center;gap:10px;min-width:0;border:2px solid var(--ink);padding:16px 14px;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--bg)}
.lk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk svg{flex:none}
.lk .ar{opacity:.5}
.lk:hover{background:var(--ink);color:var(--bg)}
.lk:hover .ar{opacity:1}
.lk.full{grid-column:1/-1}
.lbl.mt{margin-top:28px}
@media(max-width:430px){.lk{gap:8px;padding:14px 10px;font-size:12px;letter-spacing:.04em}.lk svg{width:16px;height:16px}.links{gap:12px}}

/* projects */
.card{border:2px solid var(--ink);padding:22px 20px 20px;background:var(--bg);box-shadow:0 18px 30px -18px var(--shadow)}
.screen{border:2px solid var(--ink);border-radius:10px;background:var(--screen);padding:16px 18px;margin:0 0 18px;font-size:14.5px;min-height:110px}
.meta{font-size:14px;margin:16px 0 0}
.meta b{font-weight:700}
.meta.dim{color:var(--muted);font-size:13px;margin:0 0 14px}
.dash{border:0;border-top:1px dashed var(--ink);margin:16px 0 12px}
.rule{border:0;border-top:2px solid var(--ink);margin:26px 0 22px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.pager{display:flex;gap:8px;align-items:stretch}
.pager button{border:2px solid var(--ink);background:transparent;padding:12px 14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;flex:none}
.pager button:hover{background:var(--chip)}
.pager button.on{background:var(--ink);color:var(--bg)}
.nums{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
.nums::-webkit-scrollbar{display:none}
.empty{border:2px dashed var(--ink);padding:24px;color:var(--muted)}

/* contact */
.cbig{display:flex;align-items:center;justify-content:space-between;gap:14px;border:2px solid var(--ink);padding:20px 22px;text-decoration:none;background:var(--bg);margin-top:16px}
.cbig:hover{background:var(--ink);color:var(--bg)}
.cbig small{display:block;font-size:12px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;opacity:.7}
.cbig b{display:block;font-size:clamp(16px,4.6vw,22px);letter-spacing:.04em;word-break:break-all}

/* footer */
.foot{max-width:780px;margin:22px auto 0;text-align:center}
.toggles{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
.toggles button{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:transparent;padding:14px 22px;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.toggles button:hover{background:var(--chip)}
.flinks{margin:22px 0 14px;font-weight:700;letter-spacing:.2em;font-size:12.5px;text-transform:uppercase}
.flinks a{text-decoration:none}
.flinks a:hover{text-decoration:underline}
.copy{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;word-break:break-word}

/* sticky CTA */
.sticky{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;padding:12px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);box-shadow:0 14px 40px var(--shadow);z-index:20;width:min(92vw,440px)}
.sticky .btn-b{flex:1;padding:16px 10px;font-size:14px;border-radius:4px}
.sticky .x{width:56px;background:var(--ink);color:var(--bg);border:0;font-weight:700;font-size:20px;cursor:pointer;border-radius:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;font-weight:700;letter-spacing:.1em;font-size:13px;text-transform:uppercase;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* admin */
.notice{border:2px solid var(--ink);background:var(--chip);padding:14px 16px;font-size:13.5px;margin:0 0 22px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.tabs button{border:2px solid var(--ink);background:transparent;padding:10px 14px;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.f{display:block;margin:0 0 14px}
.f>span{display:block;font-size:12px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:11px 12px;font:inherit;font-size:14px;border-radius:0}
.f textarea{resize:vertical}
.f em{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-style:normal}
.item{border:2px solid var(--ink);padding:16px;margin-bottom:16px;background:var(--bg)}
.item-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.item-h span{display:flex;gap:6px}
.sq{width:34px;height:34px;border:2px solid var(--ink);background:transparent;cursor:pointer;font-weight:700;font-size:15px;line-height:1}
.sq:hover{background:var(--ink);color:var(--bg)}
.status{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;min-height:20px}
.actions{display:grid;gap:12px;margin-top:26px;padding-top:22px;border-top:2px solid var(--ink)}
.actions .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .btn-o{justify-content:center;text-align:center;padding:16px 10px;font-size:12.5px}
.h3{font-size:14px;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 12px;font-weight:700}

/* classic mode */
:root[data-classic="on"] .hd{font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:-.02em;line-height:1.05}
:root[data-classic="on"] body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px)}
:root[data-classic="on"] .cta-box,:root[data-classic="on"] .card,:root[data-classic="on"] .sticky{box-shadow:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

(function(){
'use strict';

/* ---------- helpers ---------- */
const CACHE = 'portfolio_cache_v2', PREF = 'portfolio_prefs_v1', AUTH = 'portfolio_session_v2';
const CFG = window.PORTFOLIO_CONFIG || {};
const API = String(CFG.SUPABASE_URL || '').trim().replace(/\/+$/,''), KEY = String(CFG.SUPABASE_KEY || '').trim();
const CONFIGURED = !!(API && KEY && !/YOUR_SUPABASE/.test(API + KEY));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const ss = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const list = s => String(s||'').split(',').map(x => x.trim()).filter(Boolean);
const fixUrl = u => { u = String(u||'').trim(); if(!u) return ''; return /^(https?:|mailto:|tel:)/i.test(u) ? u : 'https://' + u; };
const hash = (s, seed=0) => { let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed; for(let i=0,ch;i<s.length;i++){ ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);} h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(16); };
const initials = n => { const w = String(n||'').trim().split(/\s+/).filter(Boolean); return (w.length>1 ? w.map(x=>x[0]).join('') : (w[0]||'ME').slice(0,2)).toUpperCase().slice(0,3); };
const setPath = (obj, path, val) => { const k = path.split('.'); let o = obj; for(let i=0;i<k.length-1;i++) o = o[k[i]]; o[k[k.length-1]] = val; };

/* ---------- state ---------- */
const DEFAULTS = JSON.parse(document.getElementById('site-data').textContent);
const mergeData = r => {
  r = (r && typeof r === 'object') ? r : {};
  const d = Object.assign(clone(DEFAULTS), r);
  d.profile = Object.assign({}, DEFAULTS.profile, r.profile);
  d.contact = Object.assign({}, DEFAULTS.contact, r.contact);
  ['qualifications','skillGroups','projects','links','internships','achievements'].forEach(k => { if(!Array.isArray(d[k])) d[k] = clone(DEFAULTS[k]); });
  return d;
};
let data;
try { data = mergeData(JSON.parse(store.get(CACHE) || 'null')); } catch(e){ data = mergeData(null); }
let session = null;
try { session = JSON.parse(store.get(AUTH) || 'null'); } catch(e){ session = null; }
let remote = CONFIGURED ? 'loading' : 'off', remoteMsg = '', dirty = false, busy = false;

try { prefs = JSON.parse(store.get(PREF) || '{}') || {}; } catch(e){ prefs = {}; }
let adminTab = 'profile', pi = 0, stickyOff = false;

/* ---------- backend: Supabase over plain REST (no SDK needed) ---------- */
async function sb(path, opt){
  opt = opt || {};
  const hd = Object.assign({ apikey: KEY, 'Content-Type': 'application/json' }, opt.headers || {});
  if(opt.auth){ const t = await token(); if(!t) throw new Error('Session expired. Please sign in again.'); hd.Authorization = 'Bearer ' + t; }
  const r = await fetch(API + path, { method: opt.method || 'GET', headers: hd, body: opt.body ? JSON.stringify(opt.body) : undefined });
  let j = null; try { j = await r.json(); } catch(e){}
  if(!r.ok) throw new Error((j && (j.error_description || j.msg || j.message || j.error)) || ('Request failed (' + r.status + ')'));
  return j;
}
function setSession(j){
  if(!j){ session = null; store.del(AUTH); return; }
  session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + ((j.expires_in || 3600) - 60) * 1000, email: (j.user && j.user.email) || (session && session.email) || '' };
  store.set(AUTH, JSON.stringify(session));
}
async function token(){
  if(!session) return null;
  if(Date.now() < session.expires_at) return session.access_token;
  try { setSession(await sb('/auth/v1/token?grant_type=refresh_token', { method:'POST', body:{ refresh_token: session.refresh_token } })); return session.access_token; }
  catch(e){ setSession(null); return null; }
}
async function loadRemote(){
  if(!CONFIGURED){ remote = 'off'; return; }
  remote = 'loading';
  try {
    const rows = await sb('/rest/v1/portfolio?id=eq.1&select=data');
    if(!Array.isArray(rows)) throw new Error('Unexpected reply from the server');
    const raw = rows[0] ? rows[0].data : {};
    if(!dirty) data = mergeData(raw);
    store.set(CACHE, JSON.stringify(raw || {}));
    remote = 'ok'; remoteMsg = '';
  } catch(e){ remote = 'error'; remoteMsg = e.message; }
  render(true);
}
async function publish(){
  if(busy) return;
  if(remote !== 'ok') return toast('Live data has not loaded, so publishing is blocked');
  busy = true; setStatus('Publishing…');
  try {
    const res = await sb('/rest/v1/portfolio?id=eq.1', { method:'PATCH', auth:true, headers:{ Prefer:'return=representation' }, body:{ data: data, updated_at: new Date().toISOString() } });
    if(!Array.isArray(res) || !res.length) throw new Error('Not allowed. This account is not the owner set in setup.sql.');
    dirty = false; store.set(CACHE, JSON.stringify(data)); toast('Published. Your site is live.');
  } catch(e){ toast(e.message); }
  busy = false; setStatus();
}
async function login(){
  const em = (document.getElementById('em') || {}).value || '', pw = (document.getElementById('pw') || {}).value || '', er = document.getElementById('pwerr');
  if(!em || !pw){ if(er) er.textContent = 'Enter your email and password.'; return; }
  if(er) er.textContent = 'Signing in…';
  try { setSession(await sb('/auth/v1/token?grant_type=password', { method:'POST', body:{ email: em.trim(), password: pw } })); render(false); }
  catch(e){ const er2 = document.getElementById('pwerr'); if(er2) er2.textContent = e.message === 'Invalid login credentials' ? 'Wrong email or password.' : e.message; }
}
function statusText(){
  if(remote === 'loading') return 'Loading live data…';
  if(remote === 'error') return 'Could not load live data (' + remoteMsg + '). Publishing is disabled until it loads.';
  return dirty ? 'Unpublished changes. Press Publish to make them live.' : 'Live site is up to date ✓';
}
function setStatus(t){ const s = document.getElementById('savestate'); if(s) s.textContent = t || statusText(); }

function pixelText(str, x, y, w, h){
  const s = String(str||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4) || 'ME';
  const cols = s.length*5 + (s.length-1);
  const cell = Math.floor(Math.min(w/cols, h/7)*10)/10;
  const ox = x + (w - cols*cell)/2, oy = y + (h - 7*cell)/2;
  let out = '';
  [...s].forEach((ch, gi) => {
    (G[ch]||G.X).split(' ').forEach((row, r) => {
      [...row].forEach((bit, c) => {
        if(bit === '1') out += `<rect x="${(ox + (gi*6 + c)*cell).toFixed(2)}" y="${(oy + r*cell).toFixed(2)}" width="${cell + .25}" height="${cell + .25}"/>`;
      });
    });
  });
  return out;
}

/* ---------- zero-gravity floaters: tiny gamepads, keyboards, webcams, mice ---------- */
const Floaters = (function(){
  const cv = document.createElement('canvas');
  cv.setAttribute('data-runtime',''); cv.setAttribute('aria-hidden','true');
  cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const KINDS = ['gp','kb','wc','ms'];
  const VB = { gp:[200,130,0,0], kb:[220,100,0,0], wc:[120,135,0,0], ms:[120,195,0,-30] };  // w, h, offsetX, offsetY
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RADIUS = 110;                       // how close the cursor must get before items scatter
  const mouse = { x:-9999, y:-9999, on:false };
  let W = 0, H = 0, dpr = 1, items = [], spr = {}, colKey = '', raf = 0, last = 0;

  function drawKind(g, k, ink, bg){
    const P = d => new Path2D(d);
    const box = (x,y,w,h,r) => { g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h); };
    const solid = (x,y,w,h,r,c) => { g.fillStyle = c; box(x,y,w,h,r); g.fill(); };
    const dot = (x,y,r,c) => { g.fillStyle = c; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); };
    const ring = (x,y,r) => { g.beginPath(); g.arc(x,y,r,0,6.2832); g.stroke(); };
    g.strokeStyle = bg; g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round';
    if(k === 'gp'){
      solid(44,12,34,9,4,ink); solid(122,12,34,9,4,ink);
      g.fillStyle = ink; g.fill(P('M50 20C35 20 25 30 18 55L8 100C5 115 15 122 27 118C38 114 44 104 52 96L148 96C156 104 162 114 173 118C185 122 195 115 192 100L182 55C175 30 165 20 150 20Z'));
      g.stroke(P('M50 42h10v7h7v10h-7v7h-10v-7h-7v-10h7z'));
      [[145,42,6],[145,64,6],[134,53,6],[156,53,6],[80,78,11],[120,78,11]].forEach(([x,y,r]) => ring(x,y,r));
      box(88,36,24,14,4); g.stroke();
      dot(80,78,5,bg); dot(120,78,5,bg);
    } else if(k === 'kb'){
      solid(6,10,208,80,10,ink);
      [[12,16,20],[11,21,37],[10,25,54]].forEach(([n,x,y]) => { for(let i=0;i<n;i++) solid(x+i*16,y,13,11,2,bg); });
      [16,32,162,178,194].forEach(x => solid(x,71,13,11,2,bg));
      solid(52,71,104,11,2,bg);
    } else if(k === 'wc'){
      dot(60,48,40,ink); ring(60,48,28); dot(60,48,16,bg); dot(60,48,7,ink); dot(54,42,2.5,bg); dot(60,14,2.5,bg);
      solid(54,86,12,28,0,ink);
      g.fillStyle = ink; g.fill(P('M24 116h72v10q0 6-6 6H30q-6 0-6-6z'));
    } else {
      g.strokeStyle = ink; g.lineWidth = 4; g.stroke(P('M60 8C60 -8 40 -12 40 -30'));
      g.strokeStyle = bg; g.lineWidth = 3.2;
      g.fillStyle = ink; g.fill(P('M60 8C30 8 14 30 14 62L14 110C14 145 34 162 60 162C86 162 106 145 106 110L106 62C106 30 90 8 60 8Z'));
      g.stroke(P('M60 8V66M14 66C40 76 80 76 106 66'));
      solid(54,26,12,22,6,bg);
    }
  }
  function makeSprite(k, ink, bg){
    const [w,h,ox,oy] = VB[k], sc = (80*dpr) / Math.max(w,h);
    const c = document.createElement('canvas');
    c.width = Math.ceil(w*sc); c.height = Math.ceil(h*sc);
    const g = c.getContext('2d'); g.scale(sc,sc); g.translate(-ox,-oy);
    drawKind(g,k,ink,bg);
    return c;
  }
  function recolor(){
    const cs = getComputedStyle(document.documentElement);
    const ink = cs.getPropertyValue('--ink').trim() || '#0b0b0b', bg = cs.getPropertyValue('--bg').trim() || '#f0ede4';
    const key = ink + '|' + bg + '|' + dpr;
    if(key === colKey) return;
    colKey = key;
    KINDS.forEach(k => { spr[k] = makeSprite(k, ink, bg); });
    draw();
  }

  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    items = [];
    const frameW = Math.min(780, W - 32), zw = (W - frameW)/2 - 26;     // width of each side gap we may use
    if(zw >= 40){
      const n = Math.max(8, Math.min(46, Math.round(zw*H/6500)));       // more room = more items
      [[13, 13+zw], [W-13-zw, W-13]].forEach(([x0,x1]) => {
        for(let i=0;i<n;i++){
          const sz = 15 + Math.random()*16, sp = 8 + Math.random()*16, dir = Math.random()*6.2832;
          const av0 = (Math.random()-.5)*.9;
          items.push({ k:KINDS[(Math.random()*4)|0], sz, r:sz/2, x0, x1,
            x:x0 + sz/2 + Math.random()*Math.max(1,(x1-x0-sz)), y:(i + Math.random())*H/n,
            vx:Math.cos(dir)*sp, vy:Math.sin(dir)*sp, sp, a:Math.random()*6.2832, av0, av:av0, al:.8 + Math.random()*.2 });
        }
      });
    }
    colKey = '';                   // force sprites to rebuild at the new pixel ratio
    recolor();
  }

  function step(dt){
    const R2 = RADIUS*RADIUS;
    for(const it of items){
      // gentle random wander + relax back to a slow cruising speed
      it.vx += (Math.random()-.5)*26*dt; it.vy += (Math.random()-.5)*26*dt;
      // cursor: push away, stronger the closer it is
      if(mouse.on){
        const dx = it.x - mouse.x, dy = it.y - mouse.y, d2 = dx*dx + dy*dy;
        if(d2 < R2){
          const d = Math.sqrt(d2) || 1, pw = 1 - d/RADIUS, acc = 5200*pw*pw + 900*pw;
          it.vx += dx/d*acc*dt; it.vy += dy/d*acc*dt;
          it.av += (dx > 0 ? 1 : -1)*pw*24*dt;
        }
      }
      const s = Math.hypot(it.vx, it.vy) || 1, k = 1 - Math.exp(-dt*1.3);
      let f = (s + (it.sp - s)*k) / s;
      if(s > 720) f = 720/s;
      it.vx *= f; it.vy *= f;
      it.av += (it.av0 - it.av)*(1 - Math.exp(-dt*1.6));
      it.x += it.vx*dt; it.y += it.vy*dt; it.a += it.av*dt;
      // soft walls: bounce inside the side gap
      if(it.x < it.x0 + it.r){ it.x = it.x0 + it.r; it.vx = Math.abs(it.vx)*.85; }
      else if(it.x > it.x1 - it.r){ it.x = it.x1 - it.r; it.vx = -Math.abs(it.vx)*.85; }
      if(it.y < it.r){ it.y = it.r; it.vy = Math.abs(it.vy)*.85; }
      else if(it.y > H - it.r){ it.y = H - it.r; it.vy = -Math.abs(it.vy)*.85; }
    }
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    for(const it of items){
      const s = spr[it.k]; if(!s) continue;
      const sc = it.sz/80, dw = s.width/dpr*sc, dh = s.height/dpr*sc;
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.a); ctx.globalAlpha = it.al;
      ctx.drawImage(s, -dw/2, -dh/2, dw, dh); ctx.restore();
    }
  }
  function frame(t){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - last)/1000 || .016); last = t;
    step(dt); draw();
  }
  function start(){
    cancelAnimationFrame(raf);
    if(reduce || !items.length){ draw(); return; }
    last = performance.now(); raf = requestAnimationFrame(frame);
  }

  window.addEventListener('pointermove', e => { if(e.pointerType === 'touch') return; mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = !reduce; }, {passive:true});
  document.addEventListener('mouseleave', () => { mouse.on = false; });
  window.addEventListener('blur', () => { mouse.on = false; });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); start(); }, 150); });
  layout(); start();
  return { recolor, items: () => items };
})();

function linkBtn(label, url, full){
  return `<a class="lk${full?' full':''}" href="${esc(fixUrl(url))}" target="_blank" rel="noopener noreferrer">${icon(label)}<span>${esc(label)}</span>${arrow}</a>`;
}
function linkBox(){
  const pr = data.projects.filter(p => p.live || p.repo);
  let projLinks = '';
  pr.forEach(p => {
    if(p.live) projLinks += linkBtn(p.title + ' / Live', p.live);
    if(p.repo) projLinks += linkBtn(p.title + ' / Code', p.repo);
  });
  return `<section class="sec grid-bg"><div class="lbl">// Link box // Channels // Feeds</div>
  <div class="links">${data.links.filter(l => l.url).map(l => linkBtn(l.label || l.url, l.url)).join('') || '<div class="empty full" style="grid-column:1/-1">No profile links yet.</div>'}</div>
  ${projLinks ? `<div class="lbl mt">// Project links</div><div class="links">${projLinks}</div>` : ''}</section>`;
}

/* ---------- pages ---------- */
const qualCard = q => `<article class="qual"><h3>${esc(q.title)}</h3><div class="org">${esc(q.org)}</div>${q.period ? `<span class="per">${esc(q.period)}</span>` : ''}${q.detail ? `<p class="det">${esc(q.detail)}</p>` : ''}</article>`;
function pageHome(){
  const p = data.profile;
  return `
  <section class="hero grid-bg">
    <div class="pad"><div class="lbl big">PORTFOLIO // SCHEMATIC</div><div class="sub">${esc(p.role)} // REF: ${new Date().getFullYear()}</div></div>
    <div class="schem">${heroSvg()}
      <div class="foot-row"><div>System: ready</div><div class="r">Rev 001<br>${esc(p.name)}</div></div></div>
    <div class="hero-cta"><h1 class="hd sm center">${esc(p.tagline)}</h1>
      <div class="cta-box"><div class="lbl">Get in touch</div><a class="btn-b" href="#/contact">Contact me</a></div></div>
  </section>

  <section class="sec grid-bg" id="about"><div class="lbl">// About me</div>
    <h2 class="hd">Hi, I'm ${esc(p.name)}</h2>
    <p>${esc(p.about).replace(/\n/g,'<br>')}</p>
    <dl class="kv"><div><dt>Role</dt><dd>${esc(p.role)}</dd></div><div><dt>Location</dt><dd>${esc(p.location)}</dd></div><div><dt>Status</dt><dd>${esc(p.status)}</dd></div></dl>
    <a class="btn-o" href="#/projects">View my projects ${arrow}</a></section>

  <section class="sec"><div class="lbl">// Qualifications // Education</div>
    <h2 class="hd">Where I learned</h2>
    <div class="list">${data.qualifications.map(qualCard).join('') || '<div class="empty">No qualifications added yet.</div>'}</div></section>

  <section class="sec grid-bg"><div class="lbl">// Skills // Stack</div>
    <h2 class="hd">What I work with</h2>
    <div class="list two">${data.skillGroups.map(g => `<div class="group"><div class="lbl">// ${esc(g.title)}</div><div class="tags">${list(g.items).map(i => `<span class="chip">#${esc(i.replace(/\s+/g,'_'))}</span>`).join('')}</div></div>`).join('') || '<div class="empty">No skills added yet.</div>'}</div></section>

  <section class="sec"><div class="lbl">// Internships // Experience</div>
    <h2 class="hd">Hands-on experience</h2>
    <div class="list">${data.internships.map(qualCard).join('') || '<div class="empty">No internships added yet.</div>'}</div></section>

  <section class="sec grid-bg"><div class="lbl">// Certifications &amp; achievements</div>
    <h2 class="hd">Milestones</h2>
    <ul class="ach">${data.achievements.map(a => `<li>${esc(a.text)}</li>`).join('')}</ul>
    ${list(p.interests).length ? `<div class="lbl mt">// Career interests</div><div class="tags" style="margin-top:12px">${list(p.interests).map(i => `<span class="chip">#${esc(i.replace(/\s+/g,'_'))}</span>`).join('')}</div>` : ''}</section>

  ${linkBox()}`;
}

function pageProjects(){
  const P = data.projects, n = P.length;
  if(pi >= n) pi = Math.max(0, n-1);
  let body;
  if(!n){
    body = `<div class="empty">No projects added yet. Add some from the owner panel.</div>`;
  } else {
    const p = P[pi], code = `PRJ_${pad(pi+1)}_${hash(p.title||'x').slice(0,3).toUpperCase()}`;
    const gh = data.links.find(l => /github/i.test(l.label) && l.url);
    const ghBtn = gh ? `<a class="mini" href="${esc(fixUrl(gh.url))}" target="_blank" rel="noopener noreferrer">More on GitHub ${arrow}</a>` : '';
    const btns = (p.live ? `<a class="mini" href="${esc(fixUrl(p.live))}" target="_blank" rel="noopener noreferrer">Live demo ${arrow}</a>` : '') + (p.repo ? `<a class="mini" href="${esc(fixUrl(p.repo))}" target="_blank" rel="noopener noreferrer">Source code ${arrow}</a>` : '');
    body = `<div class="card">
      <div class="lbl">// ${pad(pi+1)} of ${pad(n)}</div>
      <h3 class="hd md">${esc(p.title)}</h3>
      <div class="screen">${esc(p.desc).replace(/\n/g,'<br>')}</div>
      <div class="tags">${list(p.tags).map(t => `<span class="chip">#${esc(t.replace(/\s+/g,'_'))}</span>`).join('')}</div>
      <div class="meta">HASH: <b>${code}</b> &nbsp;|&nbsp; STATUS: <b>${esc(p.year||'—')}</b></div>
      <hr class="dash"><div class="meta dim">SYS_CHANNEL: PRJ_L${pad(pi+1)}</div>
      <div class="btnrow">${btns || ghBtn}</div></div>
      <hr class="rule">
      <div class="pager"><button data-act="prj-prev">◀ Prev</button>
      <div class="nums">${P.map((_,i) => `<button data-act="prj" data-i="${i}" class="${i===pi?'on':''}">PRJ_${pad(i+1)}</button>`).join('')}</div>
      <button data-act="prj-next">Next ▶</button></div>`;
  }
  return `<section class="sec grid-bg"><div class="lbl">// Projects // Log</div><h2 class="hd">Things I've built</h2>
    <p>Browse my work one project at a time. Each entry links to the live version and the source code where available.</p></section>
    <section class="sec">${body}</section>${linkBox()}`;
}

function waLink(){
  let d = String(data.contact.phone||'').replace(/\D/g,'');
  if(d.length === 10) d = '91' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(data.contact.waMessage || 'Hi')}`;
}
function mailLink(){
  const c = data.contact;
  return `mailto:${encodeURIComponent(c.email||'').replace('%40','@')}?subject=${encodeURIComponent(c.mailSubject||'Hi')}&body=${encodeURIComponent(c.mailBody||'Hi')}`;
}
function pageContact(){
  const c = data.contact;
  return `<section class="sec grid-bg"><div class="lbl">// Contact // Transmit</div>
    <h2 class="hd">Let's build something together</h2>
    <p>Pick a channel. The phone number opens WhatsApp with “${esc(c.waMessage||'Hi')}” ready to send, and the email opens your mail app with “${esc(c.mailBody||'Hi')}” already written.</p>
    <a class="cbig" href="${esc(waLink())}" target="_blank" rel="noopener noreferrer"><span><small>// Phone / WhatsApp</small><b>${esc(c.phone)}</b></span>${arrow}</a>
    <a class="cbig" href="${esc(mailLink())}"><span><small>// Email</small><b>${esc(c.email)}</b></span>${arrow}</a>
  </section>${linkBox()}`;
}

/* ---------- admin ---------- */
const F = (label, path, val, o={}) => `<label class="f"><span>${label}</span>${
  o.area ? `<textarea data-path="${path}" rows="${o.rows||4}">${esc(val)}</textarea>`
  : o.select ? `<select data-path="${path}">${o.select.map(x => `<option value="${x}"${x===val?' selected':''}>${x}</option>`).join('')}</select>`
  : `<input data-path="${path}" value="${esc(val)}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.type ? ` type="${o.type}"` : ''}>`
}${o.hint ? `<em>${o.hint}</em>` : ''}</label>`;

function listEditor(key, noun, fields){
  const arr = data[key];
  return arr.map((it,i) => `<div class="item"><div class="item-h"><b>// ${noun} ${pad(i+1)}</b><span>
    <button class="sq" data-act="up" data-k="${key}" data-i="${i}" aria-label="Move up">↑</button>
    <button class="sq" data-act="down" data-k="${key}" data-i="${i}" aria-label="Move down">↓</button>
    <button class="sq" data-act="del" data-k="${key}" data-i="${i}" aria-label="Delete">✕</button></span></div>
    ${fields.map(f => F(f.l, `${key}.${i}.${f.k}`, it[f.k], f)).join('')}</div>`).join('')
    + `<button class="btn-o sm" data-act="add" data-k="${key}">+ Add ${noun}</button>`;
}

function adminPanel(){
  const t = adminTab, p = data.profile;
  let body = '';
  if(t === 'profile') body = F('Full name','profile.name',p.name) + F('Role / headline','profile.role',p.role,{hint:'Shown under the schematic title.'}) + F('Hero tagline','profile.tagline',p.tagline,{hint:'The big line under the schematic.'}) + F('Status','profile.status',p.status,{hint:'e.g. Open to work. Also appears on the schematic.'}) + F('Location','profile.location',p.location) + F('Career interests','profile.interests',p.interests,{hint:'Separate with commas.'}) + F('About me','profile.about',p.about,{area:1,rows:7});
  if(t === 'qualifications') body = listEditor('qualifications','Qualification',[{l:'Degree / course',k:'title'},{l:'Institution',k:'org'},{l:'Period',k:'period',ph:'2022 — 2026'},{l:'Details',k:'detail',area:1,rows:3}]);
  if(t === 'internships') body = listEditor('internships','Internship',[{l:'Role',k:'title'},{l:'Company',k:'org'},{l:'Period / mode',k:'period',ph:'2026 | 1 Month | Virtual'},{l:'What you did',k:'detail',area:1,rows:3}]);
  if(t === 'achievements') body = listEditor('achievements','Achievement',[{l:'Achievement',k:'text',area:1,rows:2}]);
  if(t === 'skills') body = listEditor('skillGroups','Skill group',[{l:'Group name',k:'title'},{l:'Skills',k:'items',hint:'Separate with commas.'}]);
  if(t === 'projects') body = listEditor('projects','Project',[{l:'Title',k:'title'},{l:'Description',k:'desc',area:1,rows:4},{l:'Tech tags',k:'tags',hint:'Separate with commas.'},{l:'Status / year',k:'year',ph:'2026 | Team project'},{l:'Live link',k:'live',ph:'https://…'},{l:'Source code link',k:'repo',ph:'https://github.com/…'}]);
  if(t === 'links') body = listEditor('links','Link',[{l:'Label',k:'label',ph:'LinkedIn'},{l:'URL',k:'url',ph:'https://…'}]) + `<p class="hint">Project links are added to the link box automatically from the Projects tab.</p>`;
  if(t === 'contact'){
    const c = data.contact;
    body = F('Phone number','contact.phone',c.phone,{hint:'Include the country code, e.g. +91 98765 43210. Visitors who tap it open WhatsApp.'}) + F('WhatsApp message','contact.waMessage',c.waMessage) + F('Email address','contact.email',c.email) + F('Email subject','contact.mailSubject',c.mailSubject) + F('Email message','contact.mailBody',c.mailBody);
  }
  if(t === 'settings') body = F('Default theme for visitors','theme',data.theme,{select:['light','dark']}) +
    `<div class="h3">Change owner password</div><label class="f"><span>New password</span><input type="password" id="newpw" autocomplete="new-password"><em>At least 8 characters.</em></label>
     <button class="btn-o sm" data-act="setpw">Update password</button>
     <div class="h3">Backup</div><div class="btnrow"><button class="btn-o sm" data-act="export-json">Download data (.json)</button><button class="btn-o sm" data-act="import-json">Import data</button><input type="file" id="imp" accept=".json,application/json" hidden></div>
     <p class="hint">Import fills the editor. Press Publish afterwards to make it live.</p>
     <div class="h3">Fallback copy</div><button class="btn-o sm" data-act="export-site">Download site with current data</button>
     <p class="hint">Optional. Upload this copy to your host so visitors still see your real content if the database is ever paused or unreachable.</p>
     <div class="h3">Unpublished changes</div><button class="btn-o sm" data-act="discard">Discard and reload live data</button>`;
  const tabs = [['profile','Profile'],['qualifications','Qualifications'],['internships','Internships'],['achievements','Achievements'],['skills','Skills'],['projects','Projects'],['links','Links'],['contact','Contact'],['settings','Settings']];
  return `<div class="tabs">${tabs.map(([k,l]) => `<button data-act="tab" data-t="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>
  <div id="savestate" class="status">${esc(statusText())}</div>${remote === 'error' ? '<button class="btn-o sm" data-act="retry" style="margin-bottom:18px">Retry loading</button>' : ''}${body}
  <div class="actions"><button class="btn-b" data-act="publish">Publish changes</button>
  <div class="row"><a class="btn-o" href="#/home">Preview site</a><button class="btn-o" data-act="lock">Sign out</button></div>
  <div class="hint">Signed in as ${esc(session && session.email)}</div></div>`;
}
function pageAdmin(){
  if(remote === 'off') return `<section class="sec grid-bg"><div class="lbl">// Owner panel</div><h2 class="hd">Backend not connected</h2>
    <p>The editor needs your Supabase project. Follow SETUP.md, then paste your project URL and key into the settings block at the top of index.html.</p></section>`;
  if(!session) return `<section class="sec grid-bg"><div class="lbl">// Owner access</div><h2 class="hd">Sign in</h2>
    <label class="f"><span>Email</span><input type="email" id="em" autocomplete="username"></label>
    <label class="f"><span>Password</span><input type="password" id="pw" autocomplete="current-password"></label>
    <button class="btn-b" data-act="login">Sign in</button><p class="hint" id="pwerr"></p></section>`;
  return `<section class="sec grid-bg"><div class="lbl">// Owner panel // Editor</div><h2 class="hd">Edit my portfolio</h2>
    <div class="notice"><b>Changes go live when you press Publish.</b> Visitors always see the last published version, from any device.</div>
    ${adminPanel()}</section>`;
}

/* ---------- render / routing ---------- */
const route = () => { const h = location.hash.replace(/^#\/?/,'') || 'home'; return ['home','projects','contact','admin'].includes(h) ? h : 'home'; };
function render(keepScroll){
  const y = window.scrollY, r = route();
  applyPrefs();
  Floaters.recolor();
  document.title = `${data.profile.name} — Portfolio`;
  const page = r==='home' ? pageHome() : r==='projects' ? pageProjects() : r==='contact' ? pageContact() : pageAdmin();
  root.innerHTML = `<div class="frame">${header(r)}${page}</div>${footer()}${(r==='contact'||r==='admin'||stickyOff) ? '' : sticky()}`;
  window.scrollTo(0, keepScroll ? y : 0);
}
window.addEventListener('hashchange', () => render(false));

/* ---------- actions ---------- */
function save(){ dirty = true; setStatus(); }
function toast(m){
  let t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('data-runtime',''); document.body.appendChild(t); }
  t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400);
}
function dl(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportSite(){
  const c = document.documentElement.cloneNode(true);
  c.removeAttribute('data-theme'); c.removeAttribute('data-classic'); c.removeAttribute('style');
  c.querySelector('#root').innerHTML = '';
  c.querySelectorAll('[data-runtime]').forEach(e => e.remove());
  c.querySelector('#site-data').textContent = '\n' + JSON.stringify(data, null, 2).replace(/</g,'\\u003c') + '\n';
  dl('index.html', '<!DOCTYPE html>\n' + c.outerHTML, 'text/html');
  toast('Downloaded index.html');
}
const NEW = {
  qualifications: () => ({title:'',org:'',period:'',detail:''}),
  internships: () => ({title:'',org:'',period:'',detail:''}),
  achievements: () => ({text:''}),
  skillGroups: () => ({title:'',items:''}),
  projects: () => ({title:'New project',desc:'',tags:'',year:String(new Date().getFullYear()),live:'',repo:''}),
  links: () => ({label:'',url:''})
};

document.addEventListener('input', e => {
  const p = e.target.dataset && e.target.dataset.path;
  if(!p) return;
  setPath(data, p, e.target.value); save();
  if(p === 'theme') { prefs.theme = null; delete prefs.theme; savePrefs(); applyPrefs(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'em')) login(); });
document.addEventListener('change', e => {
  if(e.target.id !== 'imp' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if(!j.profile || !j.contact) throw new Error('bad');
      data = mergeData(j); save(); render(true); toast('Imported. Press Publish to make it live.');
    } catch(err){ toast('That file is not portfolio data'); }
  };
  fr.readAsText(e.target.files[0]);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(b) act(b.dataset.act, b.dataset);
});

function act(a, d){
  d = d || {};
  if(a === 'theme'){ prefs.theme = theme()==='dark' ? 'light' : 'dark'; savePrefs(); render(true); }
  else if(a === 'classic'){ prefs.classic = !prefs.classic; savePrefs(); render(true); }
  else if(a === 'close-sticky'){ stickyOff = true; render(true); }
  else if(a === 'prj'){ pi = +d.i; render(true); }
  else if(a === 'prj-prev'){ pi = (pi - 1 + data.projects.length) % data.projects.length; render(true); }
  else if(a === 'prj-next'){ pi = (pi + 1) % data.projects.length; render(true); }
  else if(a === 'login') login();
  else if(a === 'lock'){ setSession(null); location.hash = '#/home'; render(false); }
  else if(a === 'publish') publish();
  else if(a === 'retry') loadRemote();
  else if(a === 'tab'){ adminTab = d.t; render(true); }
  else if(a === 'add'){ data[d.k].push(NEW[d.k]()); save(); render(true); }
  else if(a === 'del'){ if(confirm('Delete this item?')){ data[d.k].splice(+d.i,1); save(); render(true); } }
  else if(a === 'up' || a === 'down'){
    const i = +d.i, j = a === 'up' ? i-1 : i+1, arr = data[d.k];
    if(j >= 0 && j < arr.length){ [arr[i], arr[j]] = [arr[j], arr[i]]; save(); render(true); }
  }
  else if(a === 'setpw'){
    const v = (document.getElementById('newpw') || {}).value || '';
    if(v.length < 8) return toast('Use at least 8 characters');
    sb('/auth/v1/user', { method:'PUT', auth:true, body:{ password: v } }).then(() => { toast('Password updated'); document.getElementById('newpw').value = ''; }).catch(e => toast(e.message));
  }
  else if(a === 'export-site') exportSite();
  else if(a === 'export-json') dl('portfolio-data.json', JSON.stringify(data, null, 2), 'application/json');
  else if(a === 'import-json') document.getElementById('imp').click();
  else if(a === 'discard'){ if(!dirty || confirm('Discard your unpublished changes?')){ dirty = false; loadRemote(); } }
}

window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
render(false);
loadRemote();
})();
</script>
</body>
</html>
